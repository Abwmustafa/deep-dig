<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Dig</title>
<meta name="description" content="A quiz about fractions, decimals and percents. Answer right, dig deeper and collect ore.">
<style>
:root{--ink:#1d1a17;--bg1:#6b4a2d;--bg2:#2c2017;--gold:#f5b82e;--gem:#2fd6c3;--grass:#58b947;--ok:#1d9a50;--okbg:#def5e4;--bad:#c9382f;--badbg:#fbe2df;--soft:#f3efe8;--line:#cfc6b8}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;transition:background .8s;-webkit-tap-highlight-color:transparent}
body.z1{--bg1:#5c6672;--bg2:#23282e}
body.z2{--bg1:#3b4068;--bg2:#14152a}
.screen{display:none;position:relative;max-width:860px;margin:0 auto;padding:16px}
.screen.on{display:block}
button{font:inherit;color:inherit;cursor:pointer}
.title{font-family:"Arial Black","Trebuchet MS",Impact,sans-serif;font-weight:900;text-transform:uppercase;color:var(--gold);text-shadow:3px 3px 0 var(--ink);letter-spacing:1px;margin:0;line-height:1.05}
.big-btn{display:block;width:100%;max-width:360px;margin:12px auto 0;padding:15px 20px;font-family:"Arial Black","Trebuchet MS",sans-serif;font-size:21px;font-weight:900;text-transform:uppercase;background:var(--grass);color:#fff;text-shadow:1px 1px 0 var(--ink);border:3px solid var(--ink);border-radius:6px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.big-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.big-btn.ghost{background:#fff;color:var(--ink);text-shadow:none;font-size:16px;padding:10px 16px}
/* start */
#start{text-align:center;padding-top:20px}
#start .title{font-size:clamp(46px,11vw,76px)}
.sub{color:#fff;font-size:18px;font-weight:700;margin:6px 0 2px}
.hero{display:block;width:100%;max-width:560px;margin:4px auto 0}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px auto 4px;max-width:620px}
.step{background:#fff;border:3px solid var(--ink);border-radius:6px;padding:10px 6px;font-weight:800;font-size:15px;line-height:1.2}
.step b{display:block;font-size:24px;color:#b06f10;font-family:"Arial Black",sans-serif}
/* hud */
.hud{background:var(--ink);color:#fff;border-radius:8px;padding:8px;margin-bottom:12px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
#strip{display:block;width:100%;height:84px;border-radius:5px;background:#1a1411}
#world{transition:transform .5s ease-out}
.blk{transition:opacity .25s}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-top:8px}
.bar{position:relative;height:24px;background:#463d34;border-radius:4px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .45s}
.bar span{position:relative;display:block;text-align:center;font-size:13px;font-weight:800;line-height:24px;text-shadow:0 1px 1px rgba(0,0,0,.7)}
.bar.pk i{background:#d9822b}.bar.pg i{background:var(--ok)}
.icon{background:#463d34;border:0;color:#fff;border-radius:5px;width:38px;height:38px;font-size:18px}
.icon.off{opacity:.45}
.ores{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:7px;font-weight:800;font-size:15px}
.ores span{display:inline-flex;align-items:center;gap:5px}
.ores svg{width:16px;height:16px}
.hud.hit{animation:hit .35s}
@keyframes hit{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-4px)}}
/* question card */
.card{background:#fff;border:3px solid var(--ink);border-radius:8px;padding:14px 16px 18px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.cardTop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.tag{background:#8a5a35;color:#fff;font-weight:800;font-size:13px;padding:4px 10px;border-radius:4px}
.read{background:var(--soft);border:2px solid var(--line);border-radius:5px;font-weight:700;font-size:13px;padding:5px 10px}
.prompt{font-size:21px;font-weight:700;line-height:1.4;margin:6px 0 10px}
.art{text-align:center;margin:0 0 12px}
.art[hidden]{display:none}
.mini{display:inline-block;max-width:100%}.mini svg{display:block;max-width:100%;height:auto}
.sheet-art{width:100%;max-width:240px;height:auto}
.opts{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.one{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:10px;min-height:58px;text-align:left;background:var(--soft);border:3px solid var(--line);border-bottom-width:6px;border-radius:6px;padding:8px 12px;font-size:20px;font-weight:800;transition:transform .08s,border-color .08s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:4px;background:var(--ink);color:#fff;font-size:15px;line-height:30px;text-align:center}
.opt .t{min-width:0}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.good .ltr{background:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);animation:hit .35s}.opt.bad .ltr{background:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.opt.dim:not(.good){opacity:.5}
.fb{margin-top:12px;font-size:17px;font-weight:600;line-height:1.5;border-radius:6px;padding:0}
.fb.on{padding:10px 12px}
.fb.good{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb b.h{font-weight:900}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-weight:800;line-height:1.1;margin:0 .15em;font-size:.92em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .25em}
.tb{border-collapse:collapse;margin:0 auto;font-size:17px;font-weight:700}
.tb th,.tb td{border:2px solid var(--ink);padding:5px 14px;text-align:left}.tb th{background:var(--soft)}
.sw{display:inline-block;width:13px;height:13px;margin-right:7px;border:1.5px solid var(--ink);vertical-align:-1px}
#nextBtn{display:none;scroll-margin-bottom:16px}
#nextBtn.on{display:block}
/* dig overlay */
#drop{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#fff}
#drop.on{display:flex}
#drop svg{width:140px}
#drop .title{font-size:32px;margin-top:8px}
/* end */
#end{text-align:center;padding-top:20px}
#end .title{font-size:clamp(30px,7vw,48px)}
#endPick{width:130px;display:block;margin:6px auto}
.score{background:#fff;border:3px solid var(--ink);border-radius:8px;padding:14px;margin:10px auto;max-width:560px}
.score .pct{font-family:"Arial Black",sans-serif;font-size:50px;color:var(--ok);line-height:1.1}
.score p{margin:4px 0;font-size:18px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 0}
.stats div{background:var(--soft);border-radius:5px;padding:8px 4px;font-size:13px;font-weight:700}
.stats b{display:block;font-size:22px;font-family:"Arial Black",sans-serif}
.again{margin:10px 0 0;text-align:left;font-size:16px;font-weight:600}
.again ul{margin:4px 0 0;padding-left:20px}
.teacher{color:#fff;font-weight:800;font-size:17px;margin:8px 0 0}
/* toast and confetti */
#toast{position:fixed;left:50%;bottom:18px;z-index:30;transform:translate(-50%,200%);visibility:hidden;background:var(--ink);color:#fff;font-weight:800;font-size:16px;padding:10px 16px;border-radius:6px;border:2px solid var(--gold);transition:transform .25s,visibility .25s;max-width:92vw;text-align:center}
#toast.on{transform:translate(-50%,0);visibility:visible}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
#confetti i{position:absolute;top:-16px;width:12px;height:12px;animation:cf 2.8s linear forwards}
@keyframes cf{to{transform:translateY(106vh) rotate(360deg)}}
@media (max-width:560px){
  .screen{padding:10px}
  #strip{height:66px}
  .row{grid-template-columns:1fr 1fr auto;gap:6px}
  .bar span{font-size:12px}
  .prompt{font-size:19px}
  .opt{font-size:18px;padding:8px}
  .steps .step{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.hud.hit,.opt.bad{animation:none}#world{transition:none}}
</style>
</head>
<body>

<section class="screen on" id="start">
  <h1 class="title">Deep Dig</h1>
  <p class="sub">One amount has three names: a fraction, a decimal and a percent.</p>
  <div id="hero"></div>
  <div class="steps">
    <div class="step"><b>1</b>Read the question</div>
    <div class="step"><b>2</b>Tap the right answer to break a block</div>
    <div class="step"><b>3</b>Dig deep and collect ore</div>
  </div>
  <button class="big-btn" id="goBtn">Start digging</button>
  <button class="big-btn ghost" id="newBtn" style="display:none">Start a new game</button>
</section>

<section class="screen" id="play">
  <header class="hud" id="hud">
    <svg id="strip" role="img" aria-label="Your miner digs a tunnel. Each right answer breaks one block."></svg>
    <div class="row">
      <div class="bar pk"><i id="pkBar"></i><span id="pkTxt"></span></div>
      <div class="bar pg"><i id="pgBar"></i><span id="pgTxt"></span></div>
      <button class="icon" id="sndBtn" aria-label="Turn the sound on or off">♪</button>
    </div>
    <div class="ores" id="ores"></div>
  </header>
  <main class="card">
    <div class="cardTop"><span class="tag" id="tag"></span><button class="read" id="readBtn">🔊 Read to me</button></div>
    <p class="prompt" id="prompt"></p>
    <div class="art" id="art"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <button class="big-btn" id="nextBtn">Next ▶</button>
  </main>
</section>

<section class="screen" id="end">
  <h1 class="title" id="endTitle"></h1>
  <svg id="endPick" viewBox="0 0 100 100" role="img" aria-label="Your pick"></svg>
  <div class="score">
    <div class="pct" id="endPct"></div>
    <p id="endLine"></p>
    <div class="stats">
      <div><b id="endOre"></b>ore collected</div>
      <div><b id="endDur"></b>pick left</div>
      <div><b id="endStreak"></b>best streak</div>
    </div>
    <div class="again" id="endAgain"></div>
  </div>
  <p class="teacher">Show this screen to your teacher.</p>
  <button class="big-btn" id="againBtn">Dig again</button>
</section>

<div id="drop"><svg id="dropArt" viewBox="0 0 60 66" role="img" aria-label="Your miner"></svg><div class="title">Digging in…</div></div>
<div id="toast" role="status"></div>
<div id="confetti" aria-hidden="true"></div>

<script>
var $ = function (id) { return document.getElementById(id); };
var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

// ---------------- audio: original music and sound effects, made live with Web Audio ----------------
var AC = null, soundOn = true, NOISE = null, MASTER = null;
function ac() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MASTER = AC.createGain(); MASTER.gain.value = 0.7; MASTER.connect(AC.destination);
    NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    var d = NOISE.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
var hz = function (m) { return 440 * Math.pow(2, (m - 69) / 12); };
function toneAt(f, t, d, type, v, f2) {
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + Math.min(0.012, d / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + d + 0.05);
}
function noiseAt(t, d, v, freq) {
  var s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; f.type = 'bandpass'; f.frequency.value = freq || 1800; f.Q.value = 0.8;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(MASTER); s.start(t); s.stop(t + d + 0.05);
}
function fx(fn) { if (!soundOn) return; try { ac(); fn(AC.currentTime + 0.01); } catch (e) { } }
var SFX = {
  mine: function () { fx(function (t) { noiseAt(t, 0.09, 0.12, 3200); toneAt(1500, t, 0.07, 'square', 0.025, 700); noiseAt(t + 0.1, 0.16, 0.1, 900); toneAt(160, t + 0.1, 0.16, 'triangle', 0.1, 70); }); },
  ore: function () { fx(function (t) { [76, 83, 88].forEach(function (m, i) { toneAt(hz(m), t + 0.16 + i * 0.07, 0.35, 'sine', 0.07); }); }); },
  hit: function () { fx(function (t) { toneAt(240, t, 0.12, 'square', 0.03, 120); noiseAt(t, 0.12, 0.08, 2400); toneAt(hz(52), t + 0.1, 0.3, 'triangle', 0.08); }); },
  fix: function () { fx(function (t) { [60, 67, 72, 79].forEach(function (m, i) { toneAt(hz(m + 12), t + i * 0.07, 0.4, 'triangle', 0.07); }); }); },
  dig: function () { fx(function (t) { for (var k = 0; k < 3; k++) { noiseAt(t + k * 0.28, 0.1, 0.1, 2800); toneAt(1300, t + k * 0.28, 0.06, 'square', 0.02, 600); } }); },
  win: function () { fx(function (t) { [[67, 0], [72, 0.16], [76, 0.32], [79, 0.48], [76, 0.72], [79, 0.88], [84, 1.04]].forEach(function (p, i) { toneAt(hz(p[0]), t + p[1], i === 6 ? 1.6 : 0.4, 'triangle', 0.1); }); [48, 55, 64].forEach(function (m) { toneAt(hz(m), t + 1.04, 1.8, 'sine', 0.09); }); }); }
};
// music: a calm plucked loop with a soft bass, a cave-like feel in a major key (C, Em, F, G)
var Music = {
  timer: null, next: 0, beat: 0,
  start: function () {
    this.stop(); if (!soundOn) return;
    try { ac(); } catch (e) { return; }
    this.beat = 0; this.next = AC.currentTime + 0.2;
    var self = this; this.timer = setInterval(function () { self.tick(); }, 60);
  },
  tick: function () { while (this.next < AC.currentTime + 0.25) { this.play(this.next, this.beat); this.next += 0.3; this.beat++; } },
  play: function (t, b) {
    var bar = Math.floor(b / 8) % 4, root = [48, 40, 41, 43][bar], ch = [[72, 76, 79], [71, 76, 79], [69, 72, 77], [71, 74, 79]][bar], pat = [0, 2, 1, 2, 0, 1, 2, 1];
    var m = ch[pat[b % 8]];
    toneAt(hz(m), t, 0.32, 'sine', 0.045); toneAt(hz(m) * 2, t, 0.1, 'sine', 0.012);
    if (b % 4 === 0) toneAt(hz(root - 12 + 12), t, 0.7, 'triangle', 0.075);
    if (b % 8 === 6) toneAt(hz(root + 7), t, 0.5, 'triangle', 0.035);
    if (b % 16 === 15) toneAt(hz(ch[2] + 12), t + 0.15, 0.6, 'sine', 0.02);
  },
  stop: function () { if (this.timer) clearInterval(this.timer); this.timer = null; }
};
document.addEventListener('visibilitychange', function () { if (document.hidden) Music.stop(); else if (S && $('play').classList.contains('on')) Music.start(); });

// ---------------- drawings ----------------
var C = { grid: '#2e86de' };
var ORE = { coal: { col: '#2b2b33', name: 'coal' }, iron: { col: '#e3b692', name: 'iron' }, gold: { col: '#f5c518', name: 'gold' }, gem: { col: '#2fd6c3', name: 'gem' } };
var ZONE = [{ b: '#8a5a35', hi: '#9c6b43', c: '#6e4727' }, { b: '#7f8a96', hi: '#919ca8', c: '#5f6974' }, { b: '#454b6e', hi: '#565d84', c: '#32375a' }];
function oreOf(i) { return i < 10 ? (i % 2 ? 'iron' : 'coal') : i < 20 ? (i % 2 ? 'gold' : 'iron') : (i % 3 === 2 || i === 29 ? 'gem' : 'gold'); }
function zoneOf(i) { return i < 10 ? 0 : i < 20 ? 1 : 2; }
function speck(x, y, r, col) { return '<polygon points="' + x + ',' + (y - r) + ' ' + (x + r) + ',' + y + ' ' + x + ',' + (y + r) + ' ' + (x - r) + ',' + y + '" fill="' + col + '" stroke="#1d1a17" stroke-width="1"/>'; }
// the miner, drawn in a 60 x 66 box: hard hat with a lamp, overalls and a pick
function minerG() {
  return '<g><path d="M44 22 L56 8" stroke="#7a4a24" stroke-width="4" stroke-linecap="round"/><path d="M47 3 Q58 3 60 15" fill="none" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/>' +
    '<rect x="18" y="33" width="24" height="20" rx="3" fill="#2e6fb5" stroke="#1d1a17" stroke-width="2.5"/><rect x="22" y="53" width="7" height="10" fill="#7a4a24" stroke="#1d1a17" stroke-width="2"/><rect x="31" y="53" width="7" height="10" fill="#7a4a24" stroke="#1d1a17" stroke-width="2"/>' +
    '<path d="M40 38 L47 22" stroke="#2e6fb5" stroke-width="6" stroke-linecap="round"/>' +
    '<rect x="16" y="13" width="28" height="22" rx="5" fill="#f0c9a0" stroke="#1d1a17" stroke-width="2.5"/><circle cx="24" cy="24" r="2.4" fill="#1d1a17"/><circle cx="36" cy="24" r="2.4" fill="#1d1a17"/><path d="M26 30 q4 3 8 0" stroke="#1d1a17" stroke-width="1.8" fill="none"/>' +
    '<path d="M12 15 Q13 3 30 3 Q47 3 48 15 Z" fill="#f5b82e" stroke="#1d1a17" stroke-width="2.5"/><rect x="26" y="4" width="8" height="7" rx="2" fill="#fff6c9" stroke="#1d1a17" stroke-width="1.5"/></g>';
}
function chestG(x, y) { return '<g transform="translate(' + x + ' ' + y + ')"><rect x="0" y="8" width="34" height="22" fill="#a86a2c" stroke="#1d1a17" stroke-width="2.5"/><path d="M0 8 Q17 -6 34 8 Z" fill="#c78438" stroke="#1d1a17" stroke-width="2.5"/><rect x="13" y="6" width="8" height="10" fill="#f5c518" stroke="#1d1a17" stroke-width="1.5"/></g>'; }
// the tunnel: 30 blocks in a row, one for each question; the world slides left as blocks break
var BLK = 40, MX = 58;
function buildStrip() {
  var s = '<g id="world">', i, W = BLK * (Q.length + 40);
  s += '<rect x="-200" y="0" width="' + (W + 200) + '" height="72" fill="#1a1411"/>';
  for (i = -6; i < Q.length + 40; i++) {
    var z = ZONE[zoneOf(Math.max(0, Math.min(i, 29)))], x = BLK * i + BLK;
    s += '<rect x="' + x + '" y="0" width="' + (BLK + 0.5) + '" height="14" fill="' + z.c + '"/><rect x="' + x + '" y="58" width="' + (BLK + 0.5) + '" height="14" fill="' + z.c + '"/>';
    if (zoneOf(Math.max(0, Math.min(i, 29))) === 0) s += '<rect x="' + x + '" y="0" width="' + (BLK + 0.5) + '" height="5" fill="#58b947"/>';
  }
  for (i = 0; i < Q.length; i++) {
    var zz = ZONE[zoneOf(i)], bx = BLK * i + BLK, col = ORE[oreOf(i)].col;
    s += '<g class="blk" id="b' + i + '"><rect x="' + bx + '" y="14" width="' + BLK + '" height="44" fill="' + zz.b + '" stroke="#1d1a17" stroke-width="1.5"/><rect x="' + (bx + 4) + '" y="18" width="' + (BLK - 8) + '" height="36" fill="' + zz.hi + '"/>' +
      speck(bx + 13, 28, 5, col) + speck(bx + 27, 34, 6, col) + speck(bx + 14, 45, 4, col) + '</g>';
  }
  s += chestG(BLK * Q.length + BLK + 14, 28) + '</g>';
  s += '<g transform="translate(' + (MX - 10) + ' 15) scale(.64)">' + minerG() + '</g>';
  $('strip').innerHTML = s;
}
function fitStrip() {
  var el = $('strip'), w = el.clientWidth, h = el.clientHeight; if (!w || !h) return;
  el.setAttribute('viewBox', '0 0 ' + Math.round(w * 72 / h) + ' 72');
}
function oreIcon(k) { return '<svg viewBox="0 0 16 16" aria-hidden="true">' + speck(8, 8, 7, ORE[k].col) + '</svg>'; }
function pickSVG(col) {
  return '<circle cx="50" cy="50" r="49" fill="#fff" stroke="#1d1a17" stroke-width="2"/><path d="M28 88 L66 34" stroke="#1d1a17" stroke-width="13" stroke-linecap="round"/><path d="M28 88 L66 34" stroke="#a86a2c" stroke-width="8" stroke-linecap="round"/>' +
    '<path d="M16 34 Q50 2 88 22 L84 34 Q54 18 30 42 Z" fill="' + col + '" stroke="#1d1a17" stroke-width="4" stroke-linejoin="round"/>';
}
function heroSVG() {
  function cube(cx, cy, s, top, l, r, ore) {

    S.solved = true;
    b.classList.add('good');
    [].forEach.call($('opts').children, function (x) { x.disabled = true; x.classList.add('dim'); });
    if (first) {
      S.ore[ore]++; S.streak++; S.best = Math.max(S.best, S.streak);
      if (S.streak % 3 === 0 && S.pick < 100) { S.pick = Math.min(100, S.pick + 10); toast(S.streak + ' in a row! Pick repaired +10%'); SFX.fix(); }
      else if (S.streak % 3 === 0) toast(S.streak + ' in a row!');
    }
    fb.className = 'fb on good';
    fb.innerHTML = '<b class="h">Correct! The block breaks.' + (first ? ' +1 ' + ORE[ore].name : '') + '</b> ' + q.x;
    SFX.mine(); if (first) SFX.ore();
    var nb = $('nextBtn'); nb.textContent = S.qi === Q.length - 1 ? 'Open the chest ▶' : 'Next ▶'; nb.classList.add('on');
    if (nb.scrollIntoView) nb.scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' });
  } else {
    if (S.tries === 0) { S.missed.push(S.qi); S.streak = 0; }
    S.tries++;
    S.pick = Math.max(0, S.pick - 10);
    b.classList.add('bad'); b.disabled = true;
    fb.className = 'fb on bad';
    fb.innerHTML = '<b class="h">The block holds! Pick −10%.</b> Try again. Hint: ' + q.hint;
    SFX.hit();
    var h = $('hud'); h.classList.remove('hit'); void h.offsetWidth; h.classList.add('hit');
  }
  hud(); save();
}
function next() {
  if (!S.solved) return;
  S.qi++; S.tries = 0; S.solved = false;
  if (S.qi >= Q.length) { finish(); return; }
  renderQ(); save(); window.scrollTo(0, 0);
  if (S.qi === 10) toast('Deeper! You reached the stone layer.');
  if (S.qi === 20) toast('The deep layer! Gems ahead.');
}

// ---------------- the end ----------------
function finish() {
  var n = Q.length, first = n - S.missed.length, pct = Math.round(first / n * 100);
  var tier = pct >= 90 ? ['Gem Pick', '#2fd6c3', 'Master miner!'] : pct >= 70 ? ['Gold Pick', '#f5c518', 'Great digging!'] : pct >= 50 ? ['Iron Pick', '#e3b692', 'Good digging!'] : ['Stone Pick', '#a3aeba', 'You reached the chest!'];
  $('endTitle').textContent = tier[2];
  $('endPick').innerHTML = pickSVG(tier[1]);
  $('endPct').textContent = pct + '%';
  $('endLine').textContent = first + ' out of ' + n + ' right on the first try. The chest holds a ' + tier[0] + '.';
  $('endOre').textContent = first; $('endDur').textContent = S.pick + '%'; $('endStreak').textContent = S.best;
  var seen = {}; S.missed.forEach(function (i) { var t = Q[i].tag; (seen[t] = seen[t] || []).push(i + 1); });
  var keys = Object.keys(seen);
  $('endAgain').innerHTML = keys.length ? '<b>Practise these again:</b><ul>' + keys.map(function (t) { return '<li>' + t + ' (question ' + seen[t].join(', ') + ')</li>'; }).join('') + '</ul>' : '';
  document.body.className = '';
  wipe(); Music.stop(); show('end'); SFX.win(); confetti();
}

// ---------------- reading aloud with the device's own voice ----------------
var CAN_SPEAK = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
function plain(el) {
  var c = el.cloneNode(true);
  [].forEach.call(c.querySelectorAll('.fr'), function (x) { x.replaceWith(' ' + x.getAttribute('data-say') + ' '); });
  [].forEach.call(c.querySelectorAll('svg'), function (s) { s.remove(); });
  return c.textContent.replace(/\s+/g, ' ').trim();
}
function readAloud() {
  if (!CAN_SPEAK) return;
  var txt = plain($('prompt'));
  [].forEach.call($('opts').children, function (b, i) { txt += ' ' + 'ABCD'[i] + '. ' + plain(b.querySelector('.t')) + '.'; });
  try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(txt); u.lang = 'en-US'; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) { }
}

// ---------------- starting ----------------
function begin(saved) {
  S = saved || fresh();
  if (S.solved) { S.qi++; S.tries = 0; S.solved = false; }
  if (S.qi >= Q.length) { finish(); return; }
  show('play'); renderQ(); save(); Music.start();
}
function drop(saved) {
  try { ac(); } catch (e) { }
  SFX.dig();
  var d = $('drop'); d.classList.add('on');
  setTimeout(function () { d.classList.remove('on'); begin(saved); }, RM ? 500 : 1100);
}
function setupStart() {
  var sv = load();
  $('goBtn').textContent = sv ? 'Continue' : 'Start digging';
  $('newBtn').style.display = sv ? 'block' : 'none';
}
$('hero').innerHTML = heroSVG();
$('dropArt').innerHTML = minerG();
buildStrip();
window.addEventListener('resize', function () { if (S) hud(); });
$('goBtn').onclick = function () { drop(load()); };
$('newBtn').onclick = function () { wipe(); drop(null); };
$('againBtn').onclick = function () { wipe(); drop(null); };
$('nextBtn').onclick = next;
$('opts').addEventListener('click', function (e) { var b = e.target.closest('.opt'); if (b) answer(+b.getAttribute('data-i')); });
$('readBtn').onclick = readAloud;
if (!CAN_SPEAK) $('readBtn').style.display = 'none';
$('sndBtn').onclick = function () {
  soundOn = !soundOn; this.classList.toggle('off', !soundOn);
  if (soundOn) Music.start(); else { Music.stop(); if (CAN_SPEAK) speechSynthesis.cancel(); }
};
setupStart();

// test hooks
window.__game = { get S() { return S; }, set S(v) { S = v; }, Q: Q, answer: answer, next: next, begin: begin, finish: finish, renderQ: renderQ, fresh: fresh, load: load, wipe: wipe, setupStart: setupStart };
</script>
</body>
